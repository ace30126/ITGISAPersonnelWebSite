name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연속 푸시 시 뒤엣것이 이긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: 타입체크 · 테스트
        run: |
          npx tsc -b --noEmit
          npx vitest run

      - name: 빌드
        run: npm run build

      # 문항 원문은 암호화된 .enc 로만 배포된다.
      # 리눅스 러너에서 평문이 섞여 들어가지 않았는지 여기서 한 번 더 막는다.
      - name: 평문 유출 검사
        run: |
          set -e
          leak=$(find dist -type f \( -name '*.json' -o -name '*.png' \) \
            ! -path 'dist/enc/*' ! -name 'manifest.json' \
            ! -name 'icon-*.png' ! -name '*.webmanifest' | wc -l)
          echo "배포 트리 평문 후보: $leak"
          test "$leak" -eq 0
          test "$(find dist/enc -name '*.enc' | wc -l)" -gt 200

      # enablement: true 로 Pages 를 워크플로가 직접 켜려 했으나 실패했다.
      # GITHUB_TOKEN 으로는 Pages 생성 권한이 없는 경우가 있다.
      # 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 켜 두면
      # 이후로는 이 단계가 기존 설정을 읽기만 한다.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
